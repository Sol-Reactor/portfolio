<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d0f1a" />
    <title>Page not found — SOL</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Outfit';
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/outfit-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/geist-mono-latin.woff2') format('woff2');
      }
      :root {
        --bg: #0d0f1a;
        --surface: #161929;
        --line: #232640;
        --ink: #eef0f8;
        --muted: #8b93b4;
        --accent: #1b2598;
        --accent-hover: #151d80;
        --accent-soft: #a5b4fc;
        --em: #818cf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        text-decoration: none;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-weight: 600;
        letter-spacing: 0.2em;
        font-size: 14px;
      }
      .terminal {
        margin: 40px 0 28px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #11131f;
        text-align: left;
        overflow: hidden;
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 14px;
      }
      .bar {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .bar span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }
      .body {
        padding: 18px 18px 20px;
        line-height: 1.8;
        color: #c8cbe0;
        word-break: break-word;
      }
      .prompt {
        color: var(--accent-soft);
      }
      .err {
        color: #ff8f85;
      }
      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1.1em;
        vertical-align: -0.2em;
        background: var(--accent-soft);
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      h1 {
        margin: 0;
        font-size: clamp(1.85rem, 6vw, 2.6rem);
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      h1 em {
        font-style: normal;
        color: var(--em);
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 10px;
        font-weight: 500;
        text-decoration: none;
        transition:
          background-color 0.2s,
          transform 0.2s,
          border-color 0.2s;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .primary:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }
      .secondary {
        border: 1px solid rgba(165, 180, 252, 0.5);
        color: var(--accent-soft);
      }
      .secondary:hover {
        border-color: var(--accent-soft);
        transform: translateY(-2px);
      }
      a:focus-visible {
        outline: 2px solid var(--accent-soft);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
        }
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1b2598" />
          <path
            transform="translate(-2 0)"
            fill="#fff"
            d="M20.5 10.2c-1-1-2.6-1.7-4.6-1.7-2.9 0-4.9 1.5-4.9 3.8 0 2.4 2 3.2 4.6 3.8 2.3.5 3.1 1 3.1 2 0 1.1-1.1 1.8-2.8 1.8-1.6 0-3-.6-4-1.6l-1.5 1.8c1.3 1.3 3.3 2 5.4 2 3.2 0 5.3-1.6 5.3-4.1 0-2.4-1.8-3.3-4.6-3.9-2.2-.5-3-.9-3-1.9 0-.9.9-1.6 2.4-1.6 1.3 0 2.4.5 3.2 1.3l1.4-1.7Z"
          />
          <rect x="21.5" y="20.6" width="5.5" height="2.6" rx="0.8" fill="#a9c4ff" />
        </svg>
        SOL
      </a>

      <div class="terminal" aria-hidden="true">
        <div class="bar"><span></span><span></span><span></span></div>
        <div class="body">
          <div><span class="prompt">sol@portfolio:~$</span> cd <span id="path">/this-page</span></div>
          <div class="err">cd: no such file or directory (404)</div>
          <div><span class="prompt">sol@portfolio:~$</span> <span class="cursor"></span></div>
        </div>
      </div>

      <h1>Page <em>not found</em></h1>
      <p>The page you're looking for doesn't exist or has moved. Everything lives on the homepage.</p>
      <div class="actions">
        <a class="btn primary" href="/">Back to homepage</a>
        <a class="btn secondary" href="/#projects">See my projects</a>
      </div>
    </main>
    <script>
      // Show the address the visitor actually tried, as the "cd" target.
      var p = location.pathname;
      if (p && p !== '/404.html') document.getElementById('path').textContent = p;
    </script>
  </body>
</html>
